<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title description">
  <title id="title">Daisywheel Xbox-style controller layout</title>
  <desc id="description">A controller diagram showing that holding LT turns the left stick into a pointer and R1 and R2 into mouse clicks. Holding RT turns the left stick into a text cursor, with LB for selection and RB for word movement. In normal typing mode the stick selects a petal, face buttons type, LB shifts case, RB switches symbols, L3 types a space, R3 backspaces, and Start enters.</desc>
  <rect width="960" height="500" rx="22" fill="#111827"/>
  <text x="32" y="38" fill="#e5e7eb" font-family="sans-serif" font-size="19" font-weight="700">Controller shortcut reference</text>

  <g font-family="sans-serif">
    <rect x="24" y="56" width="444" height="104" rx="14" fill="#172536" stroke="#38bdf8" stroke-width="2"/>
    <rect x="40" y="72" width="94" height="30" rx="8" fill="#075985"/>
    <text x="87" y="93" fill="#f0f9ff" font-size="16" font-weight="700" text-anchor="middle">HOLD LT</text>
    <text x="150" y="91" fill="#e0f2fe" font-size="16" font-weight="700">Controller mouse</text>
    <text x="40" y="126" fill="#cbd5e1" font-size="14">Left stick: move pointer  ·  R1: left click  ·  R2: right click</text>
    <text x="40" y="147" fill="#94a3b8" font-size="13">D-pad: faster scroll  ·  Only active while visible with mouse mode enabled.</text>

    <rect x="492" y="56" width="444" height="104" rx="14" fill="#201b35" stroke="#a78bfa" stroke-width="2"/>
    <rect x="508" y="72" width="94" height="30" rx="8" fill="#5b21b6"/>
    <text x="555" y="93" fill="#f5f3ff" font-size="16" font-weight="700" text-anchor="middle">HOLD RT</text>
    <text x="618" y="91" fill="#ede9fe" font-size="16" font-weight="700">Text editing</text>
    <text x="508" y="126" fill="#cbd5e1" font-size="14">Left stick: move cursor  ·  LB: select  ·  RB: move by words</text>
    <text x="508" y="147" fill="#94a3b8" font-size="13">Hold LB and RB together to select by words.</text>
  </g>

  <!-- Generic Xbox-style controller silhouette -->
  <path d="M267 210 C282 193 316 191 345 202 L444 230 H516 L615 202 C644 191 678 193 693 210 C718 221 733 239 748 259 C773 289 803 331 818 352 C840 384 779 415 748 405 C714 394 689 368 665 350 C641 377 606 397 565 397 H397 C356 397 319 377 295 350 C271 368 246 394 212 405 C181 415 161 381 182 347 Z"
        fill="#253247" stroke="#64748b" stroke-width="3"/>

  <!-- Bumpers and triggers -->
  <g font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <rect x="290" y="209" width="102" height="29" rx="10" fill="#334155" stroke="#64748b"/>
    <text x="341" y="229" fill="#e2e8f0">LB</text>
    <rect x="568" y="209" width="102" height="29" rx="10" fill="#334155" stroke="#64748b"/>
    <text x="619" y="229" fill="#e2e8f0">RB</text>
  </g>

  <!-- D-pad -->
  <g fill="#0f172a" stroke="#64748b" stroke-width="1.5">
    <rect x="266" y="277" width="30" height="92" rx="7"/>
    <rect x="235" y="308" width="92" height="30" rx="7"/>
  </g>

  <!-- Sticks -->
  <g font-family="sans-serif" text-anchor="middle">
    <circle cx="397" cy="315" r="43" fill="#111827" stroke="#64748b" stroke-width="2"/>
    <circle cx="397" cy="315" r="27" fill="#334155" stroke="#64748b"/>
    <text x="397" y="320" fill="#e2e8f0" font-size="14" font-weight="700">LS</text>
    <text x="397" y="374" fill="#94a3b8" font-size="12">L3: Space</text>

    <circle cx="565" cy="337" r="39" fill="#111827" stroke="#64748b" stroke-width="2"/>
    <circle cx="565" cy="337" r="24" fill="#334155" stroke="#64748b"/>
    <text x="565" y="342" fill="#e2e8f0" font-size="14" font-weight="700">RS</text>
    <text x="565" y="390" fill="#94a3b8" font-size="12">R3: Backspace (hold repeats)</text>
  </g>

  <!-- Face buttons use Xbox colors -->
  <g font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="683" cy="297" r="18" fill="#2563eb"/><text x="683" y="302" fill="white">X</text>
    <circle cx="722" cy="258" r="18" fill="#eab308"/><text x="722" y="263" fill="#111827">Y</text>
    <circle cx="761" cy="297" r="18" fill="#dc2626"/><text x="761" y="302" fill="white">B</text>
    <circle cx="722" cy="336" r="18" fill="#16a34a"/><text x="722" y="341" fill="white">A</text>
  </g>

  <rect x="24" y="438" width="912" height="42" rx="11" fill="#1e293b" stroke="#475569"/>
  <text x="480" y="464" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">A/B/X/Y: type  ·  Left stick: select petal  ·  LB: shift  ·  RB: symbols  ·  L3: Space  ·  R3: Backspace  ·  Start: Enter</text>
</svg>
