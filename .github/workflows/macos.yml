name: macOS build

on:
  push:
    branches: [main, feature/macos-port]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install cmake ninja qt@6 sdl2
      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6);$(brew --prefix sdl2)"
      - name: Build
        run: cmake --build build-ci --parallel 3
      - name: Test
        run: |
          ctest --test-dir build-ci --output-on-failure
          ./build-ci/daisywheel.app/Contents/MacOS/daisywheel --smoke-test
